name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      POSTGRES_DB: fitness_coach
      POSTGRES_USER: fitness_app
      POSTGRES_PASSWORD: ci_only_postgres_password
      POSTGRES_PORT: "5432"

      REDIS_PASSWORD: ci_only_redis_password
      REDIS_PORT: "6379"

      KAFKA_PORT: "9092"

      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_EXPIRATION_SECONDS: "3600"

      GEMINI_API_KEY: ci-dummy-gemini-key
      TELEGRAM_BOT_TOKEN: ci-invalid-telegram-token

      INTERVALS_API_KEY: ""
      INTERVALS_OWNER_USER_ID: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Docker Compose
        run: docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL, Redis and Kafka
        run: docker compose up -d --wait postgres redis kafka

      - name: Wait for Kafka readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list >/dev/null 2>&1; then
              echo "Kafka is ready."
              exit 0
            fi

            echo "Waiting for Kafka... attempt ${attempt}/30"
            sleep 2
          done

          docker compose logs kafka
          exit 1

      - name: Show running infrastructure
        run: docker compose ps

      - name: Build and run tests
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Build Docker image
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile is missing from the repository root."
            exit 1
          fi

          docker build --pull \
            -t ai-fitness-coach-backend:ci .

      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 || true

      - name: Stop CI infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-image:
    name: Publish production Docker image
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/raahulllkushwaha/ai-fitness-coach-backend:latest
            ghcr.io/raahulllkushwaha/ai-fitness-coach-backend:${{ github.sha }}

  deploy-production:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        shell: bash
        env:
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/azure_key
          chmod 600 ~/.ssh/azure_key

          printf '%s\n' "$AZURE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on Azure VM
        shell: bash
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/azure_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$AZURE_USER@$AZURE_HOST" \
            "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
          set -euo pipefail

          IMAGE_TAG="$1"
          IMAGE="ghcr.io/raahulllkushwaha/ai-fitness-coach-backend:${IMAGE_TAG}"

          cd /home/azureuser/apps/ai-fitness-coach

          git pull --ff-only origin main

          sudo env APP_IMAGE="$IMAGE" \
            docker compose -f docker-compose.prod.yml config --quiet

          sudo env APP_IMAGE="$IMAGE" \
            docker compose -f docker-compose.prod.yml pull app

          sudo env APP_IMAGE="$IMAGE" \
            docker compose -f docker-compose.prod.yml up -d \
            --no-deps --force-recreate app

          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:8080/actuator/health \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Deployment successful: app is healthy."
              exit 0
            fi

            echo "Waiting for application health... ${attempt}/36"
            sleep 5
          done

          sudo docker compose -f docker-compose.prod.yml logs \
            --tail=100 app || true

          echo "Deployment failed: application did not become healthy."
          exit 1
          REMOTE
